[package]
name = "agent-chat-tui"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "7.0.0"
futures-util = "0.3.34"
pulldown-cmark = "0.13.4"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tui-textarea = "0.7.0"
