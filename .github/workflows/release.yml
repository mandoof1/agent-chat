name: Release binaries

# Builds the terminal client the installer downloads (agent-chat-tui-<os>-<arch> and its
# .sha256) for every platform when a vX.Y.Z tag is pushed. The release itself is published
# from these artifacts with scripts/publish-release.sh.
on:
  push:
    tags: ["v*"]
  pull_request:  # a change to the client or its build is built for every platform before it ships
    paths: [".github/workflows/release.yml", "scripts/build-release.sh", "tui/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/main.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but app/main.py says $v"; exit 1; }
          grep -qx "PINNED_VERSION=\"$GITHUB_REF_NAME\"" site/install.sh \
            || { echo "site/install.sh's PINNED_VERSION isn't $GITHUB_REF_NAME"; exit 1; }

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-latest }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: scripts/build-release.sh
        env:
          TARGET: ${{ matrix.target }}
      - run: test -f dist/agent-chat-tui-${{ matrix.name }} && cat dist/agent-chat-tui-${{ matrix.name }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agent-chat-tui-${{ matrix.name }}
          path: dist/agent-chat-tui-${{ matrix.name }}*
          if-no-files-found: error
